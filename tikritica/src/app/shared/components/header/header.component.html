<header
  class="flex items-center justify-between px-6 py-3 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 shadow-sm"
>
  <span class="font-bold text-lg text-gray-900 dark:text-white">Tikritica</span>

  <button
    type="button"
    (click)="themeService.toggle()"
    class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    [attr.aria-label]="themeService.isDark() ? 'Mudar para modo claro' : 'Mudar para modo escuro'"
  >
    @if (themeService.isDark()) {
      ☀️
    } @else {
      🌙
    }
  </button>

  <button
    type="button"
    (click)="authFacade.logout()"
    class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    [attr.aria-label]="'Sair'"
  >
    🚪
  </button>
</header>
