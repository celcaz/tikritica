services:
  postgres:
    image: postgres:17-alpine
    container_name: tikritica-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tikritica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tikritica}
      POSTGRES_DB: ${DB_NAME:-tikritica}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
